<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Eye Blink Detector</title>
    <style>
        :root {
            --primary: #00f2fe;
            --secondary: #4facfe;
            --bg: #0a0b10;
            --surface: rgba(255, 255, 255, 0.05);
            --accent: #ff0055;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            position: relative;
            width: 90%;
            max-width: 1000px;
            background: var(--surface);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 2rem;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            border-radius: 20px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.1);
            background: #000;
        }

        #video-feed {
            width: 100%;
            display: block;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 30px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.03);
            padding: 20px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.06);
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 800;
            display: block;
            color: var(--primary);
        }

        .stat-label {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .glow {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, var(--secondary), transparent 70%);
            opacity: 0.1;
            filter: blur(100px);
            z-index: -1;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        #blink-indicator {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 20px;
            height: 20px;
            background: #444;
            border-radius: 50%;
            transition: all 0.1s;
        }

        .active-blink {
            background: var(--accent) !important;
            box-shadow: 0 0 20px var(--accent);
            transform: scale(1.2);
        }

    </style>
</head>
<body>
    <div class="glow"></div>
    <div class="container">
        <h1>Blink Pro AI</h1>
        <div class="video-wrapper">
            <img id="video-feed" src="{{ url_for('video_feed') }}" alt="Video Feed">
            <div id="blink-indicator"></div>
        </div>
        
        <div class="stats-grid">
            <div class="stat-card">
                <span class="stat-value" id="blink-count">0</span>
                <span class="stat-label">Total Blinks</span>
            </div>
            <div class="stat-card">
                <span class="stat-value" id="ear-value">0.00</span>
                <span class="stat-label">Eye State Confidence</span>
            </div>
        </div>
    </div>

    <script>
        const blinkIndicator = document.getElementById('blink-indicator');
        const blinkCount = document.getElementById('blink-count');
        const earValue = document.getElementById('ear-value');

        let lastBlinks = 0;

        function updateStats() {
            fetch('/stats')
                .then(response => response.json())
                .then(data => {
                    blinkCount.innerText = data.blinks;
                    earValue.innerText = (1 - (data.ear / 10)).toFixed(2); // Mock confidence logic for UI
                    
                    if (data.blinks > lastBlinks) {
                        blinkIndicator.classList.add('active-blink');
                        setTimeout(() => blinkIndicator.classList.remove('active-blink'), 200);
                        lastBlinks = data.blinks;
                    }
                });
        }

        setInterval(updateStats, 100);
    </script>
</body>
</html>
